# Estado de HaNet: status.hanet.muxp.art
# Upptime revisa cada sitio cada 5 minutos con GitHub Actions y publica la
# página en GitHub Pages. Configuración: https://upptime.js.org/docs/configuration
owner: HaNet-Chile
repo: status

sites:
  - name: HaNet web
    slug: app
    url: https://app.hanet.muxp.art
  # getAppStatus es público y dice si HaNet está abierto ({"open":true,...}).
  # Mientras el equipo lo cierra (Panel HNT → Estado de HaNet) sale con
  # problemas, y la página muestra el aviso con el mensaje del equipo.
  - name: Servidores
    slug: servidores
    url: https://southamerica-west1-hanet-edu.cloudfunctions.net/getAppStatus
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: '"open"'
    __dangerous__body_degraded: '"open":false'
  - name: Cuenta HaNet ID
    slug: cuenta
    url: https://id.hanet.muxp.art
  - name: Panel
    slug: panel
    url: https://panel.hanet.muxp.art
  - name: Documentación
    slug: docs
    url: https://docs.hanet.muxp.art
  - name: Sitio de HaNet
    slug: sitio
    url: https://hanet.muxp.art

status-website:
  cname: status.hanet.muxp.art
  name: Estado de HaNet
  logoUrl: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%224%200%2031%2043%22%3E%3Cpath%20d%3D%22M5.02344%2040.8102V2.18981V0L15.3522%209.55556V19.5093L20.5166%2020.1065V13.338L34.0234%2014.5324V16.7222V26.2778V28.4676L20.5166%2029.662V22.8935L15.3522%2023.4907V33.4444L5.02344%2043V40.8102Z%22%20fill%3D%22%23EF2274%22%2F%3E%3C%2Fsvg%3E"
  logoHref: /
  faviconSvg: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%224%200%2031%2043%22%3E%3Cpath%20d%3D%22M5.02344%2040.8102V2.18981V0L15.3522%209.55556V19.5093L20.5166%2020.1065V13.338L34.0234%2014.5324V16.7222V26.2778V28.4676L20.5166%2029.662V22.8935L15.3522%2023.4907V33.4444L5.02344%2043V40.8102Z%22%20fill%3D%22%23EF2274%22%2F%3E%3C%2Fsvg%3E"
  # El tema de HaNet reemplaza al oscuro de Upptime: assets/themes/dark.css se
  # copia encima del original al publicar. (Un archivo con otro nombre no
  # sirve: el generador lo visita antes de copiar los assets y deja una página
  # 404 en su lugar.) Por lo mismo, el script va en línea más abajo (js).
  theme: dark
  introTitle: Estado de HaNet
  introMessage: Si algo no anda, aquí lo ves primero. Revisamos cada parte de HaNet cada 5 minutos.
  navbar:
    - title: Estado
      href: /
    - title: Abrir HaNet
      href: https://app.hanet.muxp.art
    - title: Ayuda
      href: https://docs.hanet.muxp.art
  links:
    - rel: preconnect
      href: https://fonts.gstatic.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap
  # Aviso de "HaNet está cerrado" y textos de los incidentes en español.
  js: |
    // Estado de HaNet: lo que la página de Upptime no hace sola.
    //  1. Si el equipo cerró HaNet (Panel HNT → Estado de HaNet), muestra el aviso
    //     con su mensaje y la hora aproximada de vuelta, leídos en vivo de
    //     getAppStatus (público, con CORS abierto).
    //  2. Pasa al español los textos que Upptime escribe en inglés en los
    //     incidentes ("X is down", "Resolved: X is back up…") y saca los emojis.
    (function () {
      var STATUS_URL = "https://southamerica-west1-hanet-edu.cloudfunctions.net/getAppStatus";
      var REFRESH_MS = 60000;
      var appStatus = null;

      var COPY = {
        maintenance: { title: "Estamos haciendo mantención", body: "HaNet vuelve en un rato. Lo tuyo está guardado." },
        incident: { title: "Algo no anda bien en HaNet", body: "Ya lo estamos revisando. Lo tuyo está guardado." },
        closed: { title: "HaNet está cerrado por ahora", body: "No te preocupes, lo tuyo está guardado." },
      };

      function backAt(until) {
        var date = new Date(until);
        var time = date.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
        if (date.toDateString() === new Date().toDateString()) return "Volvemos cerca de las " + time + ".";
        var day = date.toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long" });
        return "Volvemos cerca del " + day + " a las " + time + ".";
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function renderBanner() {
        var main = document.querySelector("main");
        if (!main) return;
        var old = main.querySelector(".hn-closed");
        var onHome = location.pathname === "/" || location.pathname === "";
        if (!appStatus || appStatus.open !== false || !onHome) {
          if (old) old.remove();
          return;
        }
        var kind = COPY[appStatus.kind] ? appStatus.kind : "maintenance";
        var key = kind + "|" + (appStatus.message || "") + "|" + (appStatus.until || "");
        if (old && old.getAttribute("data-key") === key) return;

        var banner = el("section", "hn-closed" + (kind === "closed" ? " is-closed" : ""));
        banner.setAttribute("data-key", key);
        banner.setAttribute("role", "status");
        banner.appendChild(el("h2", null, COPY[kind].title));
        banner.appendChild(el("p", null, appStatus.message || COPY[kind].body));
        if (appStatus.until) banner.appendChild(el("p", null, backAt(appStatus.until)));

        if (old) old.replaceWith(banner);
        else {
          var header = main.querySelector("header");
          if (header && header.nextSibling) main.insertBefore(banner, header.nextSibling);
          else main.prepend(banner);
        }
      }

      function loadStatus() {
        fetch(STATUS_URL, { cache: "no-store" })
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (status) {
            appStatus = status;
            renderBanner();
          })
          .catch(function () {
            // Sin respuesta: el monitor de Servidores ya lo muestra.
          });
      }

      var RULES = [
        [/^\s*[✅🛑⚠️🟩🟨🟥]+\s*/u, ""],
        [/ is down$/, " no responde"],
        [/ has degraded performance$/, " con problemas"],
        [/^Resolved:?\s*/, "Resuelto: "],
        [/ is back up in /, " volvió a funcionar en "],
        [/ performance has improved in /, " volvió a la normalidad en "],
        [/ after (\d+) minutes?\.?/, " después de $1 minutos."],
        [/ was down:?/, " no respondía:"],
        [/ experienced degraded performance:?/, " tuvo problemas:"],
        [/^HTTP code: /, "Código HTTP: "],
        [/^Response time: /, "Tiempo de respuesta: "],
      [/(\d{1,2}:\d{2}):\d{2}/g, "$1"],
      [/\b1 actualizaciones/, "1 actualización"],
      ];

      function translate(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        var node;
        while ((node = walker.nextNode())) {
          var before = node.nodeValue;
          var after = before;
          for (var i = 0; i < RULES.length; i++) after = after.replace(RULES[i][0], RULES[i][1]);
          if (after !== before) node.nodeValue = after;
        }
      }

      var scheduled = false;
      function refresh() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(function () {
          scheduled = false;
          var main = document.querySelector("main");
          if (main) translate(main);
          renderBanner();
        });
      }

      function start() {
        new MutationObserver(refresh).observe(document.body, { childList: true, subtree: true, characterData: true });
        refresh();
        loadStatus();
        setInterval(loadStatus, REFRESH_MS);
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") loadStatus();
        });
      }

      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
  metaTags:
    - name: description
      content: Estado en vivo de HaNet, sus servidores y las mantenciones programadas.
    - name: theme-color
      content: "#282829"
  robotsText: "User-agent: *\nAllow: /"

